[project]
name = 'ingestion-cloud-consumer'
version = '0.1.0'

description = "RabbitMQ consumer that runs Crucible ingestion in GCP"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.49.1",
    "google-cloud-secret-manager>=2.27.0",
    "google-cloud-storage>=3.1.0",
    "pika>=1.3.2",
    "python-dotenv>=1.2.2",
] 

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion_consumer"]
